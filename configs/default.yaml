# =============================================================================
# Pattern Delineation — Default Configuration
# =============================================================================

# --- Model ---
model:
  name: "attention_unet"          # "attention_unet" | "unet"
  in_channels: 1                  # Grayscale input
  out_channels: 1                 # Binary mask output
  base_filters: 64                # First encoder stage width
  depth: 5                        # Number of encoder/decoder stages
  use_cbam: true                  # Bolt CBAM onto encoder stages
  use_blur_pool: true             # Anti-aliased downsampling
  dropout: 0.1

# --- Data ---
data:
  image_size: 512
  num_train: 10000
  num_val: 2000
  num_test: 500
  output_dir: "data/"
  num_workers: 4
  pin_memory: true

  # Shape synthesis
  shape:
    min_control_points: 5         # Bézier blob complexity
    max_control_points: 15
    min_radius_frac: 0.15         # Min shape radius as fraction of image size
    max_radius_frac: 0.40
    fill_mode: "binary"           # "binary" | "gradient" | "texture"

  # Noise
  noise:
    types: ["gaussian", "poisson", "salt_pepper", "speckle", "mixed"]
    # Per-type parameter ranges (used at max curriculum difficulty)
    gaussian_sigma: [0.01, 1.5]
    poisson_lambda: [1.0, 300.0]
    salt_pepper_prob: [0.01, 0.5]
    speckle_sigma: [0.05, 2.0]

# --- Curriculum Learning ---
curriculum:
  enabled: true
  phases:
    - name: "easy"
      start_epoch: 1
      end_epoch: 15
      noise_scale: 0.1             # Fraction of max noise range
      mixed_prob: 0.0
    - name: "medium"
      start_epoch: 16
      end_epoch: 35
      noise_scale: 0.35
      mixed_prob: 0.2
    - name: "hard"
      start_epoch: 36
      end_epoch: 60
      noise_scale: 0.7
      mixed_prob: 0.4
    - name: "extreme"
      start_epoch: 61
      end_epoch: 100
      noise_scale: 1.0
      mixed_prob: 0.6

# --- Loss ---
loss:
  dice_weight: 1.0
  bce_weight: 1.0                 # Decays to bce_weight_min over training
  bce_weight_min: 0.5
  boundary_weight: 0.0            # Ramps to boundary_weight_max over training
  boundary_weight_max: 0.5
  tversky_alpha: 0.7              # FN penalty weight
  tversky_beta: 0.3               # FP penalty weight
  boundary_ramp_start_epoch: 20
  boundary_ramp_end_epoch: 60

# --- Training ---
training:
  epochs: 100
  batch_size: 4
  lr: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: "adamw"              # "adam" | "adamw"
  scheduler: "cosine"             # "cosine" | "plateau" | "step"
  warmup_epochs: 3
  grad_clip_norm: 1.0
  mixed_precision: true
  seed: 42

  # Checkpointing
  checkpoint_dir: "checkpoints/"
  save_every: 5
  save_best_metric: "dice"

  # Early stopping
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.001

# --- Evaluation ---
evaluation:
  metrics: ["dice", "iou", "hausdorff", "boundary_f1"]
  threshold: 0.5                  # Binarization threshold for predictions

# --- Preprocessing ---
preprocessing:
  enabled: false                  # Set true for optional spatial filtering
  bilateral:
    d: 9
    sigma_color: 75
    sigma_space: 75
  nlm:
    h: 10
    template_window: 7
    search_window: 21

# --- Visualization ---
visualization:
  log_every: 50                   # Log sample images every N batches
  num_samples: 4                  # Number of samples to visualize
