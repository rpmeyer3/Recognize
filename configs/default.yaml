model:
  name: "attention_unet"
  in_channels: 1
  out_channels: 1
  base_filters: 64
  depth: 5
  use_cbam: true
  use_blur_pool: true
  dropout: 0.1

data:
  image_size: 512
  num_train: 5000
  num_val: 2000
  num_test: 500
  output_dir: "data/"
  num_workers: 4
  pin_memory: true
  shape:
    min_control_points: 5
    max_control_points: 15
    min_radius_frac: 0.15
    max_radius_frac: 0.40
    fill_mode: "binary"
    min_dots: 15
    max_dots: 80
    min_dot_radius: 2
    max_dot_radius: 6
    dot_intensity_range: [0.6, 1.0]
    bg_intensity_range: [0.0, 0.4]
    jitter_frac: 0.03
  noise:
    types: ["gaussian", "poisson", "salt_pepper", "speckle", "mixed"]
    gaussian_sigma: [0.01, 1.5]
    poisson_lambda: [1.0, 300.0]
    salt_pepper_prob: [0.01, 0.5]
    speckle_sigma: [0.05, 2.0]

curriculum:
  enabled: true
  phases:
    - name: "easy"
      start_epoch: 1
      end_epoch: 5
      noise_scale: 0.1
      mixed_prob: 0.0
    - name: "medium"
      start_epoch: 6
      end_epoch: 20
      noise_scale: 0.35
      mixed_prob: 0.2
    - name: "hard"
      start_epoch: 21
      end_epoch: 45
      noise_scale: 0.7
      mixed_prob: 0.4
    - name: "extreme"
      start_epoch: 46
      end_epoch: 80
      noise_scale: 1.0
      mixed_prob: 0.6

loss:
  dice_weight: 1.0
  bce_weight: 1.0
  bce_weight_min: 0.5
  boundary_weight: 0.0
  boundary_weight_max: 0.5
  tversky_alpha: 0.7
  tversky_beta: 0.3
  boundary_ramp_start_epoch: 20
  boundary_ramp_end_epoch: 60

training:
  epochs: 80
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 3
  grad_clip_norm: 1.0
  mixed_precision: true
  seed: 42
  checkpoint_dir: "checkpoints/"
  save_every: 5
  save_best_metric: "dice"
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.001

evaluation:
  metrics: ["dice", "iou", "hausdorff", "boundary_f1"]
  threshold: 0.5

preprocessing:
  enabled: false
  bilateral:
    d: 9
    sigma_color: 75
    sigma_space: 75
  nlm:
    h: 10
    template_window: 7
    search_window: 21

visualization:
  log_every: 50
  num_samples: 4
